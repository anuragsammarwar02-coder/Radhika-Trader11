  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 180, 255, 0.1) 0%, transparent 40%),
        linear-gradient(180deg, #0a0a0f 0%, #0f1419 100%);
      z-index: -1;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 20px;
      background: rgba(18, 22, 30, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 36px 28px 32px;
      text-align: center;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #00ff88;
      margin-bottom: 28px;
    }

    .logo-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 24px;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ff88, #00b4ff);
      z-index: -1;
      animation: pulse-ring 2.5s ease-in-out infinite;
    }

    .logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0a0a0f;
      display: block;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    .countdown {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #00ff88, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 8px 0 6px;
      letter-spacing: -2px;
    }

    .countdown-label {
      font-size: 13px;
      color: #8b95a5;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 28px;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .feature {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 500;
      color: #e8ecf0;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .feature span {
      font-size: 18px;
    }

    .agency {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 80, 80, 0.1);
      border: 1px solid rgba(255, 80, 80, 0.35);
      color: #ff6b6b;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 50px;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }

    .join-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      color: #0a0a0f;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      padding: 18px;
      border-radius: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 25px rgba(0, 255, 136, 0.35);
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 255, 136, 0.45);
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: #6b7585;
    }

    .footer strong {
      color: #00ff88;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .card {
        margin: 12px;
        padding: 28px 20px 26px;
        border-radius: 22px;
      }

      .countdown {
        font-size: 64px;
      }

      .logo-wrap, .logo {
        width: 115px;
        height: 115px;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="brand">Telugu Trader Radhika</div>

    <div class="logo-wrap">
      <img 
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsjywMTWjhgxhO8y9rwb7UoV6veO4N0HRqpcDIixIY2g&s=10" 
        alt="Telugu Trader Radhika" 
        class="logo"
      >
    </div>

    <div class="countdown" id="countdown">15</div>
    <div class="countdown-label">Seconds Left</div>

    <div class="features">
      <div class="feature">
        <span>✅</span>
        SMC • Gold • BTC Setups
      </div>
      <div class="feature">
        <span>🏆</span>
        Smart Money Strategies & Tips
      </div>
      <div class="feature">
        <span>📈</span>
        Daily Expert Trading Insights
      </div>
      <div class="feature">
        <span>🛡️</span>
        Proper Risk Management
      </div>
    </div>

    <div class="agency">
      📢 Ads Managed by AK GrowthX Agency
    </div>

    <a href="https://t.me/+8iKvaOVeFLkzZDY1" class="join-btn">
      Join Free Channel 🚀
    </a>

    <div class="footer">
      Free joining ends in <strong id="footer-count">15</strong> seconds
    </div>

  </div>

  <script>
    let count = 15;
    const countEl = document.getElementById('countdown');
    const footerEl = document.getElementById('footer-count');
    const redirectUrl = "https://t.me/+8iKvaOVeFLkzZDY1";

    const timer = setInterval(() => {
      count--;
      countEl.innerText = count;
      footerEl.innerText = count;

      if (count <= 0) {
        clearInterval(timer);
        window.location.href = redirectUrl;
      }
    }, 1000);
  </script>

</body>
